[project]
name = "credit-policy-optimizer"
version = "0.1.0"
description = "Credit Policy Optimizer - Platform for credit risk scoring and optimal policy decisioning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sebastian Urzua" }
]
dependencies = [
    "fastapi",
    "lightgbm",
    "numpy",
    "plotly>=5.20.0",
    "polars",
    "pydantic>=2.0",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "streamlit>=1.35.0",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]
notebooks = [
    "ipykernel",
    "matplotlib",
    "pyarrow",
    "seaborn",
]
ui = [
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]
notebooks = [
    "ipykernel",
    "matplotlib",
    "pyarrow",
    "seaborn",
]
ui = [
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["scratch", "notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["credit_policy_optimizer"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_subclassing_any = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "joblib.*",
    "lightgbm.*",
    "streamlit.*",
    "plotly.*",
]
ignore_missing_imports = true
disallow_subclassing_any = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=credit_policy_optimizer --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
